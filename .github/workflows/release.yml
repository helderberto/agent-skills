name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Publish the version in plugin.json if untagged
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already tagged"
            exit 0
          fi
          bash scripts/release-notes.sh "$version" > notes.md
          if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2> /dev/null)" = true ]; then
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file notes.md --draft=false
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
